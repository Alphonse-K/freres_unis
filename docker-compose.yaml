services:
  web:
   build:
     context: .
     dockerfile: docker/app/Dockerfile
   container_name: web_freres_unis
   env_file: .env
   depends_on:
     - db
   ports:
     - "8030:8000"
   volumes:
     - ./src:/app/src
     - ./alembic.ini:/app/alembic.ini
     - ./alembic:/app/alembic
     - ./uploads:/app/uploads
     - ./media:/app/media
     - ./logs:/app/logs
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: freres_unis_worker
    command: celery -A src.core.celery worker --loglevel=info -Q balance_incremental --concurrency=1
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      # single-concurrency worker: only ever needs one DB connection at a time
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=3
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./media:/app/media
      - ./logs:/app/logs
    restart: always

  beat:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: freres_unis_beat
    command: >
      celery -A src.core.celery beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      # scheduler only -- never queries the DB itself, just enqueues tasks
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      - redis
      - db
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    restart: always

volumes:
  postgres_data:
  redis_data:
